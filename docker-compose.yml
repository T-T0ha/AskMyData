services:
  db:
    # pgvector ships on top of the official postgres image; the semantic layer
    # (Phase 4) and the column-name embeddings (Phase 0) both need it, and
    # LangGraph checkpoints live in this same database.
    image: pgvector/pgvector:pg16
    container_name: semanticlayer-db
    environment:
      POSTGRES_USER: semantic
      POSTGRES_PASSWORD: semantic
      POSTGRES_DB: semanticlayer
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/init-pgvector.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
      - ./ops/init-readonly-role.sql:/docker-entrypoint-initdb.d/01-readonly-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semantic -d semanticlayer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
